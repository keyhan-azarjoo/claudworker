<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Claudworker · Agent Control</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" href="/favicon.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="theme-color" content="#0a0e16"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Claudworker Agents"/>
<style>
:root{--bg:#0a0e16;--panel:#121a2b;--panel2:#0e1524;--line:#23304a;--tx:#eef2f8;--mut:#8b9bb4;
 --ok:#34d399;--run:#38bdf8;--warn:#fbbf24;--orange:#fb923c;--err:#f87171;--pause:#c4b5fd;--acc:#2dd4bf;--accs:#22d3ee;
 --shadow:0 12px 30px -16px rgba(0,0,0,.6)}
:root.light{--bg:#eef2f8;--panel:#ffffff;--panel2:#f3f6fb;--line:#d6deea;--tx:#16203a;--mut:#5a6a86;
 --ok:#059669;--run:#0284c7;--warn:#d97706;--orange:#ea580c;--err:#dc2626;--pause:#7c3aed;--acc:#0d9488;--accs:#0891b2;
 --shadow:0 10px 26px -18px rgba(20,40,80,.35)}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--tx);
 background:radial-gradient(1100px 600px at 78% -12%,#15263f 0,#0a0e16 58%) fixed;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#243248;border-radius:9px}
a{color:var(--accs);text-decoration:none}
.hidden{display:none!important}
/* header */
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
 padding:calc(12px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 12px calc(18px + env(safe-area-inset-left));
 position:sticky;top:0;z-index:30;background:rgba(10,14,22,.82);backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--line)}
header .logo{width:26px;height:26px;border-radius:8px}
header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px}
.spacer{flex:1}
.chip{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:4px 11px;background:#0e1626}
.chip b{color:var(--run);font-weight:700}
.btn{background:#1b2640;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:12.5px;font-weight:500;transition:.15s}
.btn:hover{border-color:#3a4d72;transform:translateY(-1px)}.btn:active{transform:none}
.btn.on{background:linear-gradient(180deg,#103024,#0c241b);border-color:#1f6b4d;color:#6ee7b7}
.btn.p{background:linear-gradient(180deg,#173050,#102541);border-color:#2b517f;color:#bfdbff}
.btn.danger{background:#321722;border-color:#6e2a3b;color:#fca5a5}
.gz{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
.gb{width:84px;height:7px;background:#1b2740;border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle}
.gb>i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#fbbf24,#f87171)}
/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);background:#0b1220}
.tg{display:flex;gap:5px;align-items:center;background:#0e1626;border:1px solid var(--line);border-radius:12px;padding:4px}
.tg>.btn{border:none;background:transparent;padding:6px 9px}.tg>.btn.sel{background:#1b2640;border:1px solid #2b3c5c}
.tg .lab{font-size:11px;color:var(--mut);padding:0 6px}
input.num{width:50px;background:#0c1422;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:5px;font-size:12px;text-align:center}
select.sel{background:#0c1422;border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:6px;font-size:12px}
select option, select.sel option{background:#121a2b;color:#eef2f8}
/* build bar */
.buildbar{padding:9px 18px;border-bottom:1px solid var(--line);background:#0b1220}
.brow{display:flex;align-items:center;gap:11px;margin:4px 0;font-size:12.5px}
.brow .nm{min-width:130px;font-weight:600}.bb{flex:1;height:9px;background:#16203400;background:#162034;border-radius:99px;overflow:hidden}
.bb>i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#34d399);transition:width .5s}
/* layout */
.wrap{max-width:none;margin:0 auto;padding:16px clamp(14px,2vw,40px)}
.layout{display:flex;gap:18px;align-items:flex-start}
#main{flex:1;min-width:0}#aside{width:clamp(300px,22vw,400px);flex-shrink:0}
@media(max-width:1000px){.layout{display:block}#aside{display:none}}
h2.sec{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;margin:18px 0 9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
/* cards */
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:15px;padding:14px;
 cursor:pointer;transition:.15s;box-shadow:0 1px 0 rgba(255,255,255,.02) inset}
.card:hover{border-color:#34466b;transform:translateY(-2px);box-shadow:0 10px 30px -16px rgba(0,0,0,.6)}
.card h3{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.tagk{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-weight:600}
.tags{font-size:10px;color:#0b1220;background:var(--acc);border-radius:6px;padding:1px 7px;font-weight:800}
.bdg{font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:99px;border:1px solid;font-weight:700}
.s-running{color:var(--run);border-color:#1d4e63;background:#08283a}.s-idle{color:var(--mut);border-color:#2a3650}
.s-paused{color:var(--pause);border-color:#3a2f55}.s-done{color:var(--ok);border-color:#1c4a30;background:#082017}.s-error{color:var(--err);border-color:#5a2330;background:#2a1117}
.pbar{height:9px;background:#162034;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--run),var(--acc));transition:width .5s;border-radius:99px}
.pbar.done>i{background:linear-gradient(90deg,#10b981,#34d399)}
.lines{font-size:12.5px;color:var(--mut);min-height:30px}.lines .d{color:#bbf7d0}.lines .d::before{content:"✓ ";color:var(--ok)}
.lines .t::before{content:"→ ";color:var(--run)}
.meta{display:flex;gap:10px;font-size:11px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.acts .btn{padding:5px 9px}
.sch{display:flex;gap:5px;margin-top:8px}.sch select,.sch input{background:#0c1422;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:4px 6px;font-size:11px;width:74px}
.subline{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);padding:3px 0}.subline b{color:#cbd5e1;font-weight:600}
/* panels */
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:15px}
.panel h2{font-size:12px;margin:0 0 11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:700}
.rowi{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:7px 0;border-bottom:1px solid #18233a}
.rowi:last-child{border:none}.free{color:var(--ok)}.busy{color:var(--warn)}.off{color:var(--err)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.glance{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.gchip{font-size:12px;border:1px solid var(--line);border-radius:9px;padding:5px 11px;background:var(--panel);color:var(--mut)}
.gchip b{color:var(--tx)}
/* explicit grid = real side-by-side columns that resize with the screen (auto-fit stretches columns to fill the width and reflows the count as the window changes); min-width:0 + overflow:hidden let each column shrink past its long text */
/* Columns never narrower than 240px (min(100%,…) so they shrink to 1-up on a phone instead of cramming
   3 tiny overlapping columns). auto-fit then gives 1 col on a phone, 2 on a wide phone, more on desktop. */
.tcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;align-items:start}
.tcol{min-width:0;overflow:hidden;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:10px}
.tcol *{min-width:0;max-width:100%}
/* ANTI-OVERLAP (all widths): names/keys/summaries CLIP with an ellipsis instead of spilling over their
   neighbours. min-width:0 alone (above) only lets the box shrink — without overflow clipping the TEXT
   still overflowed and overlapped the next element. Header/card rows also wrap as a last resort. */
.tcolh>div{flex-wrap:wrap;row-gap:3px}
.tcolh b,.tcr b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcr{flex-wrap:wrap;row-gap:2px}
.tcard .mini{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Phone: shrink the team columns' fonts/bars/buttons. Column COUNT is left to auto-fit (base rule) so a
   narrow phone gets 1 wide column (no cramming) and a wider phone gets 2 — never 3 tiny overlapping ones. */
@media(max-width:600px){
  .tcols{gap:8px}
  .tcol{padding:7px;border-radius:10px}
  .tcolh{padding-bottom:5px}
  .tcolh b{font-size:11.5px}
  .tcard{padding:5px 6px;margin-bottom:5px;border-radius:7px}
  .tcr{gap:4px}
  .tcol h3{font-size:12px}
  .tcol .mini,.tcol .free,.tcol .subline,.tcol .tagk{font-size:9.5px!important}
  .tcol .btn{font-size:9px!important;padding:2px 5px!important}
  .tcol .pbar{height:5px!important;margin:3px 0 2px!important}
  .tcol .gb{width:46px!important;height:5px!important}
  .glance{gap:5px;margin-bottom:9px}
  .gchip{font-size:10px;padding:3px 7px;border-radius:7px}
  h2.sec{font-size:14px}
  /* STOP OVERLAP: let the header/card rows wrap, and let the long name shrink with an ellipsis
     instead of pushing the model tag / % / buttons on top of each other in a narrow column. */
  .tcol .tcolh>div{flex-wrap:wrap;row-gap:3px}
  .tcol .tcolh b,.tcol .tcr b{min-width:0;flex-shrink:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tcol .tcr{flex-wrap:wrap;row-gap:3px}
  .tcol .acts{flex-wrap:wrap;row-gap:4px}
  .tcol .tagk,.tcol .free,.tcol .tags{white-space:nowrap;flex:none}
  .tcol .pbar{flex-basis:100%}              /* progress bar always on its own full-width line */
  .tcol .tcr .btn{flex:none}                /* per-agent run/pause buttons keep their size, wrap as a unit */
  /* card headers (team page agents, detail) + section headers: wrap instead of overlapping */
  .card h3{flex-wrap:wrap;row-gap:3px}
  .card{padding:11px}
  .acts{gap:5px}
  h2{font-size:16px}
  .sec h2,h2.sec{word-break:break-word}
}
@media(max-width:380px){.tcols{grid-template-columns:1fr}}
.tcolh{border-bottom:1px solid var(--line);padding-bottom:7px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:7px;cursor:pointer;transition:.12s}
.tcard:hover{border-color:var(--acc)}
.tcr{display:flex;align-items:center;gap:6px}
.tdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.dtbl th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.dtbl td{padding:8px 10px 8px 0;border-bottom:1px solid #18233a;vertical-align:top}
.dtbl tr:last-child td{border:none}
.mini{font-size:12.5px;color:var(--mut)}.mini b{color:var(--tx);font-weight:700}
.empty{color:var(--mut);font-size:12px;padding:8px 0}
.path{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.pc{flex:1;min-width:220px;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.pc .lab{font-size:11px;color:var(--mut);display:flex;justify-content:space-between;margin-bottom:6px}.pc .lab b{color:var(--tx)}
.pc i{display:block;height:9px;border-radius:99px;background:linear-gradient(90deg,var(--acc),#34d399);transition:width .6s}
.pc .track{height:9px;background:#162034;border-radius:99px;overflow:hidden}
/* tickets/chat */
.tline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;padding:8px 0;border-bottom:1px solid #18233a}
.tk{display:flex;gap:7px;margin:8px 0;overflow-x:auto;flex-wrap:nowrap;max-width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tk::-webkit-scrollbar{display:none}
.tk>*{flex:0 0 auto}
.chat{display:flex;flex-direction:column;height:260px}
.clog{flex:1;overflow:auto;background:#0a1120;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12.5px}
.m{margin:7px 0}.m.me{color:#cbd5e1}.m.ag{color:#a7f3d0}.m .who{color:var(--mut);font-size:10px;display:block;margin-bottom:2px}
.cin{display:flex;gap:6px;margin-top:8px}.cin select{width:120px}.cin input{flex:1;background:#0c1422;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px}
.mic{background:#321722;border-color:#6e2a3b}.mic.rec{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.45}}
.fin{width:100%;background:#0c1422;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;margin:6px 0;font-size:14px}
.back{cursor:pointer;color:var(--acc);font-size:13px;font-weight:600;display:inline-flex;gap:4px;margin-bottom:10px}
#busy{position:fixed;inset:0;background:rgba(5,8,14,.55);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:80;color:var(--tx);font-size:14px}
#busy.show{display:flex}
.spin{width:44px;height:44px;border:4px solid #22304a;border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;justify-content:space-around;
 background:rgba(13,20,34,.9);backdrop-filter:saturate(160%) blur(18px);border-top:1px solid var(--line);
 padding:7px max(8px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right));
 z-index:40;box-shadow:0 -10px 34px -14px rgba(0,0,0,.7)}
.tabbar a{flex:1;max-width:96px;text-align:center;padding:7px 4px;color:var(--mut);font-size:10px;font-weight:600;letter-spacing:.2px;
 cursor:pointer;transition:.18s;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar a .ic{font-size:20px;line-height:1;transition:.18s;filter:grayscale(.3) opacity(.8)}
.tabbar a.act{color:var(--acc);background:linear-gradient(180deg,rgba(56,189,248,.18),rgba(56,189,248,.03))}
.tabbar a.act .ic{transform:translateY(-1px) scale(1.12);filter:none}
.tabbar a:active{transform:scale(.9)}
/* floating Speak (Tgo voice) button — always one tap away, esp. in the car */
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:45;
 display:flex;align-items:center;gap:8px;height:54px;padding:0 20px;border-radius:30px;
 background:linear-gradient(180deg,#2b9fd4,#1576a8);color:#fff;font-weight:700;font-size:15px;
 text-decoration:none;box-shadow:0 14px 34px -10px rgba(56,189,248,.7);border:1px solid #5cc0ec}
.fab:active{transform:scale(.94)}.fab .mic{font-size:22px}
/* saved/loading feedback */
#cwtoast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(12px);background:#0d1a12;border:1px solid #1f5135;color:#a7f3d0;padding:9px 16px;border-radius:11px;font-size:13px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}
#cwtoast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#cwtoast.err{background:#1f0d0d;border-color:#5a2020;color:#fca5a5}
.saving{outline:2px solid var(--warn)!important;opacity:.7}
.saved{outline:2px solid var(--ok)!important}
button[data-busy]{opacity:.8}
/* login */
.login{position:fixed;inset:0;background:radial-gradient(900px 500px at 50% 0,#15263f,#0a0e16);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.lbox{background:linear-gradient(180deg,#121a2b,#0d1422);border:1px solid var(--line);border-radius:20px;padding:30px;width:340px;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
.lbox img{width:72px;height:72px;border-radius:18px;margin-bottom:12px}
.lbox input{width:100%;background:#0c1422;border:1px solid var(--line);color:var(--tx);border-radius:11px;padding:12px;margin:7px 0;font-size:14px}
.lbox .btn{width:100%;margin-top:10px;padding:13px;font-size:14px;font-weight:700}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="lbox">
    <img src="/logo.png" alt=""/>
    <h1 style="margin:0 0 2px;font-size:18px">Claudworker Agent Control</h1>
    <div class="empty" id="lerr">sign in</div>
    <input id="lu" placeholder="username" autocomplete="username"/>
    <input id="lp" type="password" placeholder="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="btn p" onclick="doLogin()">Sign in</button>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <img class="logo" src="/logo.png" alt=""/>
  <h1>Claudworker · Agents</h1>
  <span class="chip">working <b id="wn">0</b></span>
  <span class="chip" id="cibadge" style="display:none;cursor:pointer" title="automated test status — tap to view" onclick="goTab('tasks')"></span>
  <span class="chip" id="clock">●</span>
  <div class="spacer"></div>
  <span class="gz" id="banner">–</span>
  <button class="btn p" title="Pause: stop starting NEW work, but let agents already running FINISH their jobs first (graceful)." onclick="api('/api/pause',{name:'all'})">⏸ pause (finish jobs)</button>
  <button class="btn p" title="Pause FAST (safe): stop new work + stop running agents immediately. Safe — killed agents resume exactly where they left off (session-resume), so no work is lost." onclick="api('/api/pausefast',{})">⏸ pause (fast)</button>
  <button class="btn" id="bPWI" title="Pause when the whole session's work is finished: keep working through the ENTIRE queue, then pause once everything is drained (nothing running + no tickets left in any lane). Click again to cancel." onclick="var on=this.dataset.on==='1';api('/api/pausewhenidle',{on:(on?'false':'true')});">⏸ pause at session end</button>
  <button class="btn p" title="Resume all (lift pause)." onclick="resumeAll()">▶ resume</button>
  <button class="btn danger" title="Stop NOW: pause + immediately kill every running agent (work in progress is interrupted)." onclick="if(confirm('Stop now and KILL running agents?'))api('/api/stopall',{})">⏹ stop now (kill)</button>
  <button class="btn" onclick="openV('__needs__')">🙋 Needs you</button>
  <button class="btn" onclick="openV('__human__')">🧪 Human test</button>
  <button class="btn" onclick="openV('__history__')">🕘 24h</button>
  <button class="btn" onclick="refreshNow()" title="update">🔄</button>
  <button class="btn" onclick="openV('__settings__')">⚙️</button>
  <button class="btn" onclick="logout()">⎋</button>
</header>

<div class="toolbar">
  <span class="lab" style="opacity:.7">⚙️ speed is set <b>per account</b> →</span>
  <button class="btn" onclick="openV('__accounts__')">🔑 Accounts</button>
  <select class="sel" id="bMode" title="Work now = run immediately (still gated + batched, so token-frugal). Scheduler = run on the timer." onchange="api('/api/boost',{on:this.value})"><option value="true">⚡ Work now</option><option value="false">🗓 Scheduler</option></select>
  <select class="sel" id="bEff" disabled title="Effort is AUTOMATIC & locked: low for ops/polling, medium for deploy/test, high for engineering/review, max auto on live Sentry-critical work. Decided per agent+task to maximise quality at lowest tokens."><option value="">🔒 effort: auto</option></select>
  <select class="sel" id="bView" onchange="setView(this.value)"><option value="grouped">view: grouped</option><option value="all">view: all</option></select>
  <select class="sel" id="bScope" title="in view:all, show Done/Failed for TODAY only or ALL-time" onchange="setScope(this.value)"><option value="today">scope: today</option><option value="all">scope: all-time</option></select>
  <span class="chip" title="Batch size: how many related tickets each agent does per run (one session, no re-reading). 0 = one task per run.">📦 batch <input id="bBatch" type="number" min="0" max="100" style="width:54px" onchange="api('/api/batch',{n:this.value})"/></span>
  <span class="chip" title="Per-team queue: how many tickets the pump keeps queued for EACH team in stage-building, pulled from the backlog — so a team's queue never goes empty while it has tasks.">🗂️ queue/team <input id="bTQ" type="number" min="1" max="200" style="width:54px" onchange="api('/api/teamqueue',{n:this.value})"/></span>
  <span class="chip" id="bCaps" title="run-at-once × sub-agents per account — auto from each account's speed">⚙️ —</span>

// minimal, safe Markdown → HTML so Tgo's chat replies render like a real .md file
function mdRender(t){t=esc(t||'');
  t=t.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre style="background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;margin:6px 0"><code>'+c.replace(/^\n/,'')+'</code></pre>');
  t=t.replace(/`([^`]+)`/g,'<code style="background:var(--panel2);padding:1px 5px;border-radius:4px">$1</code>');
  t=t.replace(/^#### (.*)$/gm,'<h4 style="margin:8px 0 3px">$1</h4>').replace(/^### (.*)$/gm,'<h4 style="margin:9px 0 4px">$1</h4>').replace(/^## (.*)$/gm,'<h3 style="margin:11px 0 5px">$1</h3>').replace(/^# (.*)$/gm,'<h3 style="margin:12px 0 6px">$1</h3>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/__([^_]+)__/g,'<b>$1</b>');
  t=t.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" style="color:#7dd3fc">$1</a>');
  t=t.replace(/^\s*[\-\*] (.*)$/gm,'<div style="margin:1px 0 1px 8px">• $1</div>');
  t=t.replace(/^\s*(\d+)\. (.*)$/gm,'<div style="margin:1px 0 1px 8px">$1. $2</div>');
  t=t.replace(/\n/g,'<br>');
  t=t.replace(/<pre([\s\S]*?)<\/pre>/g,m=>m.replace(/<br>/g,'\n'));
  t=t.replace(/(<\/(?:h3|h4|div|pre)>)<br>/g,'$1');
  return t;}

// Usage-bar colour by how close to the limit: green plenty-left → yellow at the warning (70%) →
// orange high (80%) → red at the account's pause cap (the limit). Drives every usage bar.
const WARN_PCT=70, HIGH_PCT=80;
function usageColor(used,cap){cap=cap||98;
  if(used>=cap) return 'var(--err)';      // at / over the limit
  if(used>=HIGH_PCT) return 'var(--orange)'; // above 80% — getting close
  if(used>=WARN_PCT) return 'var(--warn)';   // in the warning band
  return 'var(--ok)';}                        // plenty of headroom
// nextWarn: how many % remain until the NEXT threshold the bar will cross, + a label for it.
function nextWarn(used,cap){cap=cap||98;
  if(used<WARN_PCT) return {to:WARN_PCT-used,lbl:'warning'};
  if(used<HIGH_PCT) return {to:HIGH_PCT-used,lbl:'80%'};

// liveReset: the server sends a reset value (minutes) snapshotted at its last ~5-min poll; tick it
// DOWN in real time so usage visibly keeps updating every second — for ALL accounts incl. paused.
let _resetTrack={};
function liveReset(key,serverVal){
  if(serverVal==null||serverVal<0)return serverVal;
  const t=_resetTrack[key];
  if(!t||Math.abs(t.v-serverVal)>1){_resetTrack[key]={v:serverVal,at:Date.now()};return serverVal;}
  return Math.max(0,Math.round(t.v-(Date.now()-t.at)/60000));
}

function busy(on,txt){const x=document.getElementById('busy');if(!x)return;if(on){document.getElementById('busytxt').textContent=txt||'working…';x.classList.add('show');}else x.classList.remove('show');}
function toast(msg,ok){let t=document.getElementById('cwtoast');if(!t){t=document.createElement('div');t.id='cwtoast';document.body.appendChild(t);}

// api() also gives the control that triggered it a loading→saved state, and shows a "✓ saved"
// message — for EVERY settings button/dropdown/checkbox, automatically.
const api=(u,b)=>{
  const el=(typeof event!=='undefined'&&event)?(event.currentTarget||event.target):null;
  let orig=null;
  if(el&&el.tagName==='BUTTON'){orig=el.innerHTML;el.dataset.busy='1';el.disabled=true;el.textContent='⏳ saving…';}
  else if(el&&(el.tagName==='SELECT'||el.tagName==='INPUT')){el.classList.add('saving');el.dataset.edited=String(Date.now());} // mark just-edited so re-renders don't flip it back
  busy(true,(b&&b.name?b.name+' · ':'')+(u.split('/').pop()));
  return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(b||{})})
   .then(r=>{if(r.status===401){location.reload();}
     const okk=r.ok!==false;
     if(el&&el.dataset&&el.dataset.busy){el.textContent='✓ saved';setTimeout(()=>{if(el.dataset.busy){el.innerHTML=orig;el.disabled=false;delete el.dataset.busy;}},1000);}
     else if(el&&el.classList){el.classList.remove('saving');el.classList.add('saved');setTimeout(()=>el.classList&&el.classList.remove('saved'),1000);}
     if(!okk)toast('server busy — try again',false); // success no longer pops a toast on every click; the button/input shows ✓ inline
     return r;})
   .catch(e=>{if(el&&el.dataset&&el.dataset.busy){el.innerHTML=orig;el.disabled=false;delete el.dataset.busy;}else if(el&&el.classList){el.classList.remove('saving');}toast('failed',false);throw e;})
   .finally(()=>busy(false));};

const TABS=[['agents','🟢','Tasks'],['tasks','🎫','Backlog'],['mm','📣','Media'],['accounts','🔑','Accounts'],['devices','🔌','Devices'],['servers','🖥️','Servers']];
function smoothPct(a){const p=a.progress||{};if(p.done||a.state==='done')return 100;if(p.pct>0)return Math.min(100,p.pct);
  if(a.state==='running'&&a.startedAt){const t=(Date.now()-new Date(a.startedAt).getTime())/1000;if(t>0)return Math.min(93,Math.round(100*(1-Math.exp(-t/180))));}
  return a.state==='running'?4:0;}
// Dedupe innerHTML writes: skip the DOM swap when the new HTML equals what's already there.
// This stops the whole-page "refresh/flicker" every SSE tick (most ticks don't change a panel),
// so live updates apply in the background without wiping scroll, focus, or your click state.
function dedupHTML(el){ if(!el||el._dedup) return; el._dedup=1;
  const d=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
  Object.defineProperty(el,'innerHTML',{configurable:true,
    get(){return d.get.call(this);},
    set(v){ if(this._lh===v) return; this._lh=v; d.set.call(this,v); }});
}
function start(){
  $('#app').classList.remove('hidden');$('#tabbar').classList.remove('hidden');$('#fab').classList.remove('hidden');
  dedupHTML($('#main')); dedupHTML($('#aside')); // background updates, no flicker
  $('#tabbar').innerHTML=TABS.map(t=>'<a id="tb-'+t[0]+'" onclick="goTab(\''+t[0]+'\')"><span class="ic">'+t[1]+'</span>'+t[2]+'</a>').join('');
  const es=new EventSource('/api/stream',{withCredentials:true});
  // Live re-render every tick — BUT if the owner is selecting/copying text, defer the re-render
  // (innerHTML swap would clear the selection). Flush the held update the moment the selection clears.
  es.onmessage=e=>{try{S=JSON.parse(e.data);if(hasSel()){_pendingRender=true;return;}render();}catch(_){}};
  document.addEventListener('selectionchange',()=>{if(_pendingRender&&!hasSel()){_pendingRender=false;render();}});
  es.onerror=()=>{$('#clock').textContent='⚠ reconnecting…';};

  loadFn(); setInterval(loadFn, 30000);   // function-run feed (Functions sub-team)

}

// per-ticket pipeline tracker: 🛠 Build → 🔍 Review → 🧪 Test → 🚀 Deploy → ✓ Done, each shown as
// ✓ pass / ↻ in progress / ☐ waiting / ✗ failed — derived from the ticket's labels + status.
function pipeHTML(lbls,status){
  var L=(lbls||[]).map(function(x){return String(x).toLowerCase();});
  var has=function(){for(var i=0;i<arguments.length;i++){if(L.indexOf(arguments[i])>=0)return true;}return false;};
  var done=/done|closed|resolved/i.test(status||''), cancel=/cancel/i.test(status||'');
  if(cancel) return '<div class="mini" style="color:#f87171;font-weight:700;margin:8px 0">🚫 Cancelled</div>';
  // index of the CURRENT (active) stage: 0 build,1 review,2 test,3 deploy,4 done
  var reached = done?4
    : has('ready-to-deploy','stage-deploy')?3
    : (has('ready-for-test','stage-test')||(has('code-approved')&&has('security-approved')))?2
    : has('ready-for-review','stage-review','code-approved','security-approved')?1
    : has('stage-building')?0 : -1;
  var failAt = has('changes-requested')?1 : has('test-failure')?2 : -1;
  var names=['Build','Review','Test','Deploy'], ico={pass:'✓',active:'↻',wait:'☐',fail:'✗'},
      col={pass:'#34d399',active:'#fbbf24',wait:'var(--mut)',fail:'#f87171'};
  var cells=names.map(function(nm,i){
    var st = (failAt===i)?'fail' : done?'pass' : (reached<0)?'wait' : (i<reached)?'pass' : (i===reached)?'active':'wait';
    var word={pass:'pass',active:'working',wait:'waiting',fail:'failed'}[st];
    return '<span style="color:'+col[st]+';white-space:nowrap">'+ico[st]+' '+nm+' <span style="opacity:.7;font-weight:400">'+word+'</span></span>';
  });
  cells.push('<span style="color:'+(done?'#34d399':'var(--mut)')+';white-space:nowrap">'+(done?'✓':'☐')+' Done</span>');
  return '<div style="display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:600;margin:10px 0;align-items:center">'
    +cells.join('<span style="color:var(--line)">→</span>')+'</div>';
}
function renderTicket(k){
  $('#main').innerHTML='<span class="back" onclick="goTab(tab)">← back</span><div class="empty">loading '+esc(k)+'…</div>';
  fetch('/api/ticket?key='+encodeURIComponent(k),{credentials:'include'}).then(r=>r.json()).then(d=>{
    if(!d||d.error){$('#main').innerHTML='<span class="back" onclick="goTab(tab)">← back</span><div class="empty">could not load '+esc(k)+'</div>';return;}
    const labels=(d.labels||[]).slice(0,4).map(x=>'<span class="tagk">'+esc(x)+'</span>').join(' ');
    // brief = first 2 sentences of the description, capped ~240 chars (no wall of text)
    const raw=(d.description||'').replace(/\s+/g,' ').trim();

      +'<div class="meta" style="margin:6px 0">'+esc(d.status||'')+' · '+esc(d.priority||'')+(labels?' · '+labels:'')+'</div>'

      +'<div class="acts" style="margin-top:12px">'+action+'<a class="btn" href="'+d.url+'" target="_blank">open in Jira ↗</a></div>'

  try{localStorage.setItem('cw_nav',JSON.stringify({tab:tab,detail:detail,ticketKey:ticketKey,taskView:taskView}));}catch(_){}
  // working count, de-flickered: a brief drop to 0 between batches is held for a few ticks
  // (only shows 0 once it's genuinely been 0 for ~4s) so it doesn't jump 18→0→18.
  // Use the SAME "isWorking" rule as the idle banner (running AND not finished/100%) so the header and the
  // "fleet idle — 0 agents" banner can never disagree (an agent stuck in state=running at 100% is NOT working).
  const running=ags.filter(a=>a.state==='running'&&!(a.progress&&(a.progress.done||(a.progress.pct||0)>=100))).length;
  if(running>0){window._wkLast=running;window._wkZero=0;}
  else{window._wkZero=(window._wkZero||0)+1;}
  $('#wn').textContent=(running>0)?running:((window._wkZero>=4)?0:(window._wkLast||0));
  // Don't overwrite a control the owner just changed: skip if it's focused OR was edited in the last ~5s.
  // (Fixes the "saved → flips back to old value for a second → shows new" flicker: the SSE frame still
  // carries the old value for a tick after the save, and was clobbering the input.)
  const setSel=(id,val)=>{const e=$('#'+id);if(!e||document.activeElement===e)return;
    if(e.dataset.edited&&(Date.now()-(+e.dataset.edited))<5000)return; e.value=val;};
  setSel('bMode',d.boost?'true':'false');setSel('bEff',d.effort||'');setSel('bView',view);setSel('bScope',scope);setSel('bBatch',(d.batchSize==null?20:d.batchSize));setSel('bTQ',(d.perTeamQueue==null?20:d.perTeamQueue));
  var pwi=document.getElementById('bPWI'); if(pwi){pwi.dataset.on=d.pauseWhenIdle?'1':'0';pwi.textContent=d.pauseWhenIdle?'⏳ will pause at session end (cancel)':'⏸ pause at session end';pwi.classList.toggle('p',!!d.pauseWhenIdle);}
  // read-only per-account capacity on the header: run-at-once × sub, auto-derived from each speed.

    const acc=(d.accounts||[]).filter(a=>!a.paused&&a.loggedIn);
    let tot=0;const parts=acc.map(a=>{const c=a.concEffective||0,f=a.fanEffective||0;tot+=c;const nm=(a.email||a.label).split('@')[0];
      return '<span style="white-space:nowrap">'+esc(nm)+' <b style="color:var(--ok)">'+c+'</b>'+(f?'×'+f:'')+'</span>';});

  if(!bannerAcc.length && accs.length) bannerAcc=accs.filter(a=>a.week>=0).slice(0,1);
  // Banner shows the WEEKLY limit for each selected account (the long-term cap to watch), session after.
  const bar=(a)=>{const wk=(a.week!=null&&a.week>=0)?a.week:-1;const hr=(a.hour!=null&&a.hour>=0)?a.hour:-1;
    const col=wk<0?'#36486a':usageColor(wk,a.cap);
    const nm=(a.email||a.label).split('@')[0];
    return '<span title="'+esc(a.email||a.label)+'" style="display:inline-flex;align-items:center;gap:5px"><b style="font-size:10px;color:var(--mut);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(nm)+'</b><span class="gb"><i style="width:'+(wk<0?0:Math.min(100,wk))+'%;background:'+col+'"></i></span><span style="font-size:11px">'+(wk<0?'n/a':'wk '+wk+'%')+(hr>=0?(' · 5h '+hr+'%'):'')+'</span></span>';};
  $('#banner').innerHTML = bannerAcc.length? bannerAcc.map(bar).join(' <span style="opacity:.3">|</span> ') + (d.paceTarget>0?(' <span style="font-size:11px">🎯'+d.paceTarget+'%</span>'):'') : '–';
  $('#clock').textContent=(d.survival?'🪫 survival ':(d.paused?'⏸ ':(d.boost?'⚡ ':'● ')))+(d.ts||'');
  $('#clock').title=d.survival?'All Claude accounts hit their limit — running ONLY small, safe tasks (reports/tests) on a small codex model until the limit resets. A small model can make mistakes, so code changes + deploys are paused.':'';
  // build/deploy bar
  const bl=ags.filter(a=>a.state==='running'&&a.progress&&(a.progress.phase==='build'||a.progress.phase==='deploy'));
  const bb=$('#buildbar');
  if(bl.length){bb.classList.remove('hidden');bb.innerHTML=bl.map(a=>'<div class="brow"><span class="nm">'+(a.progress.phase==='deploy'?'🚀':'🔨')+' '+esc(a.name)+'</span><div class="bb"><i style="width:'+(a.progress.pct||0)+'%"></i></div><span>'+(a.progress.pct||0)+'%</span></div>').join('');}
  else bb.classList.add('hidden');
  // keep the overview sidebar on every tab; the team columns pack side by side next to it (min-width:0)
  {const asideEl=document.getElementById('aside');asideEl.style.display='';const ae=document.activeElement;if(!(ae&&(ae.id==='sideChat')))renderAside();}
  // LIVE pages: re-render on each tick so removals/counts/usage update instantly.

  else if(tab==='mm'){if(!mmSite)renderMultimedia();} // don't reload the embedded marketing iframe every tick
  else if(tab==='servers')renderServers();
}

  var isCap=function(r){return /max concurrent|concurrency limit|no account is free|fleet is full/i.test(r||'');};

    lines.push('🚦 Fleet is full — '+capN.length+' run(s) waiting · all accounts at their limit ('+(busy.join(' · ')||'—')+').');

// VIEW: ALL — flat, sorted list of TASKS in one place: ▶ Working (with progress bar + current step) →
// ✓ Done today → ☐ In queue → ✗ Failed today. (Today = since 00:00, per the backend lists.)
function flatAllHTML(d){
  var tk=d.tickets||{}, ags=d.agents||[], todayOnly=(scope!=='all');
  var isW=function(a){return a.state==='running'&&!(a.progress&&(a.progress.done||(a.progress.pct||0)>=100));};
  // collapsible section header (click to collapse/expand)
  var sec=function(id,title,color,n){var c=_collapsed[id];return '<h3 class="sec" style="font-size:13px;color:'+color+';margin:12px 0 5px;text-transform:none;cursor:pointer;user-select:none" onclick="toggleCollapse(\''+id+'\')">'+(c?'▸':'▾')+' '+title+' <span class="mini" style="color:var(--mut)">'+n+'</span></h3>';};
  // a selectable task row (checkbox + key + summary + run); ticket rows in done/queue/failed
  var tkrow=function(x,color,mark){var k=esc(x.key),seld=_sel.has(x.key);
    return '<div class="tcard"><div class="tcr">'
      +'<input type="checkbox" '+(seld?'checked':'')+' onclick="toggleSel(\''+k+'\',event)" title="select for bulk run" style="flex:none;margin-right:2px">'
      +'<span class="tdot" style="background:'+color+'"></span>'
      +'<b style="color:#fbbf24;cursor:pointer" onclick="openTicket(\''+k+'\')">'+k+'</b> '
      +'<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer" onclick="openTicket(\''+k+'\')">'+esc(x.summary||'')+'</span>'+(mark||'')
      +'<button class="btn p" style="font-size:9px;padding:1px 6px;flex:none" title="activate + run this task" onclick="event.stopPropagation();_sel.add(\''+k+'\');runSelected(false)">▶</button></div></div>';};
  var list=function(arr,id,fn){return arr.slice(0,_shown(id)).map(fn).join('')+moreBtn(id,arr.length);};
  var body=function(id,arr,empty,fn){return _collapsed[id]?'':(arr.length?list(arr,id,fn):'<div class="empty" style="font-size:11px">'+empty+'</div>');};
  // WORKING: live agents, each with a progress bar + the current step
  var working=ags.filter(isW);
  var wHTML=_collapsed['flat:w']?'':(working.slice(0,_shown('flat:w')).map(function(a){var p=a.progress||{},pct=smoothPct(a);
    var tks=[...new Set((((p.doneLine||'')+' '+(p.todoLine||'')+' '+(p.doing||'')+' '+(p.did||[]).join(' ')+' '+(a.lastMsg||'')).match(/SCRUM-\d+/g))||[])];
    var step=esc((p.doing||p.todoLine||p.doneLine||a.lastMsg||'working…')).slice(0,100);
    return '<div class="tcard" onclick="openA(\''+a.name+'\')"><div class="tcr"><span class="tdot" style="background:var(--run)"></span><b>'+esc(a.name)+'</b>'

      +'<div class="pbar" style="margin:4px 0 3px"><i style="width:'+pct+'%;background:var(--run)"></i></div>'
      +'<div class="mini" style="color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">↻ '+step+'</div></div>';
  }).join('')+moreBtn('flat:w',working.length))||'<div class="empty" style="font-size:11px">none working right now</div>';

function renderDetail(name){

    +'<div style="font-size:13px;line-height:1.7">'+bt.map(function(t){var st=t.state||'todo';return '<div style="display:flex;gap:7px;align-items:baseline;padding:3px 0;border-bottom:1px solid #131d30;cursor:pointer" onclick="openTicket(\''+esc(t.key)+'\')"><span style="color:'+(col[st]||'var(--mut)')+';font-weight:700;flex:none">'+(ico[st]||'☐')+'</span><b style="color:#fbbf24;flex:none">'+esc(t.key)+'</b><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)">'+esc(t.summary||'')+'</span>'+(t.step?'<span class="mini" style="color:var(--mut);flex:none">'+esc(t.step).slice(0,42)+'</span>':'')+'</div>';}).join('')+'</div></div>'):'';

      +'<div class="pbar"><i style="width:'+(p.pct||(total?Math.round((did.length+fail.length)/total*100):0))+'%;background:'+(fail.length?'var(--err)':'var(--run)')+'"></i></div>'

      +(p.doing?'<div style="color:#fbbf24;font-weight:600">↻ '+esc(p.doing)+'</div>':'')
      +(p.todoLine?'<div style="color:#38bdf8">→ '+esc(p.todoLine)+'</div>':'')

      +'</div></div>'):'';
  $('#main').innerHTML='<span class="back" onclick="goTab(tab)">← back</span>'

}

// ---- Chat with Tgo (the main full-access agent, like Claude in VS Code) ----
let tgoLog=[]; // {who:'me'|'tgo', body, streaming}
function sendMain(msg){msg=(msg||'').trim();if(!msg)return; // NO lock — chat while it answers the previous one
  const history=tgoLog.slice(-12).map(m=>(m.who==='me'?'You: ':'Tgo: ')+m.body).join('\n');
  tgoLog.push({who:'me',body:msg});
  const idx=tgoLog.push({who:'tgo',body:'',streaming:true})-1;
  if(detail==='__chat__')renderChat();
  const sr=$('#sideChatReply');if(sr)sr.textContent='Tgo is typing…';
  fetch('/api/chat/stream',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,history:history})})
   .then(resp=>{if(!resp.body)throw 0;const rd=resp.body.getReader(),dec=new TextDecoder();let buf='';
     (function pump(){rd.read().then(({done,value})=>{
       if(done){tgoLog[idx].streaming=false;liveStream(idx);return;}
       buf+=dec.decode(value,{stream:true});const ps=buf.split('\n\n');buf=ps.pop();
       ps.forEach(p=>{const j=p.indexOf('data: ');if(j>=0){const raw=p.slice(j+6);if(raw==='[DONE]'){tgoLog[idx].streaming=false;}else{try{tgoLog[idx].body+=JSON.parse(raw);}catch(_){}}}});
       liveStream(idx);pump();
     }).catch(()=>{tgoLog[idx].streaming=false;if(!tgoLog[idx].body)tgoLog[idx].body='⚠ stream dropped — press Send again';liveStream(idx);});})();
   }).catch(()=>{tgoLog[idx].streaming=false;tgoLog[idx].body=tgoLog[idx].body||'⚠ couldn\'t reach Tgo — press Send again';liveStream(idx);});
}
// update JUST the streaming message element (smooth typing; no full re-render, keeps your input focused)
function liveStream(idx){const el=$('#tgomsg-'+idx);const m=tgoLog[idx];
  if(el){if(m.streaming){el.style.whiteSpace='pre-wrap';el.textContent=(m.body||'')+' ▌';}
         else{el.style.whiteSpace='';el.innerHTML=(m.who==='tgo'?mdRender(m.body):esc(m.body||''));} // finished → render as markdown
         const c=$('#tgoClog');if(c)c.scrollTop=1e9;}
  else if(detail==='__chat__')renderChat();
  const s=$('#sideChatReply');if(s)s.textContent='Tgo: '+(((tgoLog[idx].body||'').slice(-150))||'…');}
function chatVoice(btnId,inId){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice needs Safari or Chrome.');return;}
  const b=$('#'+btnId);const rec=new SR();rec.lang=(localStorage.getItem('cw_voicelang')||'en-US');rec.interimResults=false;if(b)b.classList.add('rec');
  rec.onresult=e=>{const txt=e.results[0][0].transcript;const m=$('#'+inId);if(m){m.value=(m.value?m.value+' ':'')+txt;m.focus();}};
  rec.onerror=()=>{if(b)b.classList.remove('rec');};rec.onend=()=>{if(b)b.classList.remove('rec');};
  try{rec.start();}catch(_){}}
function setVoiceLang(l){localStorage.setItem('cw_voicelang',l);renderChat();}
function renderChat(){
  const log=tgoLog.map((m,i)=>{const isMe=m.who==='me';
    const body=(isMe||m.streaming)?('<span style="white-space:pre-wrap">'+esc(m.body)+(m.streaming?' ▌':'')+'</span>'):mdRender(m.body); // finished Tgo replies render as markdown
    return '<div class="m '+(isMe?'me':'ag')+'"><span class="who">'+(isMe?'you':'🤖 Tgo')+'</span><span class="body" id="tgomsg-'+i+'">'+body+'</span></div>';
   }).join('')||'<div class="empty">Ask Tgo anything — it runs on your Mac with full access (like Claude in VS Code) and can do real work, spawn agents, manage the fleet, or just answer. It streams its reply + remembers this conversation, and you can keep typing while it works.</div>';
  const vl=localStorage.getItem('cw_voicelang')||'en-US';
  $('#main').innerHTML='<span class="back" onclick="goTab(tab)">← back</span>'
    +'<div class="panel" style="display:flex;flex-direction:column;height:74vh"><div class="meta" style="justify-content:space-between;align-items:center"><h2 style="margin:0">💬 Chat with Tgo — your main agent</h2>'
      +'<span class="mini" style="display:flex;gap:6px;align-items:center">🎤 '+selOpts('tgoVlang',['en-US','fa-IR'],vl,{'en-US':'English','fa-IR':'فارسی'},'setVoiceLang(this.value)')+'<button class="btn" onclick="location.href=\'/speak.html\'" title="full voice page">🎙 Speak</button><button class="btn" onclick="tgoLog=[];renderChat()">🗑 clear</button></span></div>'
    +'<div class="clog" id="tgoClog" style="flex:1">'+log+'</div>'
    +'<div class="cin" style="margin-top:8px;display:flex;gap:6px;align-items:flex-end">'
      +'<textarea id="tgoMsg" placeholder="ask Tgo anything…  (Enter = send · Shift+Enter = new line · 🎤 to speak)" style="flex:1;min-height:46px;max-height:160px;resize:vertical;font:inherit;padding:9px" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();var v=this.value;this.value=\'\';sendMain(v);}"></textarea>'
      +'<button class="btn mic" id="tgoMic" onclick="chatVoice(\'tgoMic\',\'tgoMsg\')" title="speak">🎤</button>'
      +'<button class="btn p" onclick="(function(){var e=document.getElementById(\'tgoMsg\');var v=e.value;e.value=\'\';sendMain(v);})()">Send</button></div></div>';
  const c=$('#tgoClog');if(c)c.scrollTop=1e9;
}
function marketingCtl(action){toast('marketing: '+action+'…');api('/api/marketing/control',{action:action}).then(r=>r.json()).then(d=>toast('marketing: '+(d.result||'done')));}
function marketingPanel(){const m=S.marketing||{};
  const on=m.running;const st=m.ok?(on?'<span class="free">● running</span>':'<span class="off">● stopped</span>')+(m.state?' <span class="mini" style="color:var(--mut)">'+esc(m.state)+'</span>':''):'<span class="mini" style="color:var(--mut)">status unavailable (VPS unreachable)</span>';
  return '<div class="panel"><h2>📣 Marketing service <span class="tagk" style="color:var(--mut)">retired</span></h2>'
    +'<div class="mini" style="color:var(--mut);margin-bottom:6px">Retired — content now lives in the <b>📣 Media tab</b> here. The old VPS Docker engine is stopped (not deleted); <b>Start</b> re-enables it only if you need its channel-publishing while that\'s migrated in.</div>'
    +'<div class="rowi"><span>marketing-agent</span><span>'+st+'</span></div>'
    +'<div class="acts" style="margin-top:8px">'
    +'<button class="btn p" onclick="marketingCtl(\'start\')"'+(on?' disabled':'')+'>▶ Start</button>'
    +'<button class="btn" style="color:var(--pause)" onclick="marketingCtl(\'stop\')"'+(on?'':' disabled')+'>⏹ Stop</button>'
    +'<button class="btn" onclick="marketingCtl(\'restart\')">🔄 Restart</button>'
    +'<a class="btn" href="https://marketing.example.com" target="_blank">open ↗</a></div></div>';
}
function accountsHtml(ac){ac=(ac||[]).slice().sort((x,y)=>(x.engine==='codex'?1:0)-(y.engine==='codex'?1:0));return (ac&&ac.length?ac.map(a=>{
  // lead with the CURRENT SESSION (active 5h window, like /usage), weekly after
  const hr=(a.hour!=null&&a.hour>=0)?a.hour:-1, wk=(a.week!=null&&a.week>=0)?a.week:a.pct,k=hr>=0||wk>=0;
  const colh=hr<0?'#36486a':usageColor(hr,100), colw=(wk<0)?'#36486a':usageColor(wk,a.cap);
  const det=k?('session '+(hr>=0?hr:0)+'% · wk '+(wk>=0?wk:0)+'%'+(a.hourReset>=0?(' · ↻'+fmtMin(liveReset(a.label+'h',a.hourReset))):'')):esc(a.note||'n/a');
  const bars=k?('<div class="mini" style="display:flex;align-items:center;gap:4px;margin-top:3px"><span style="width:36px;color:var(--mut)">5h</span><span class="gb" style="flex:1"><i style="width:'+(hr>=0?Math.min(100,hr):0)+'%;background:'+colh+'"></i></span><span style="width:28px;text-align:right">'+(hr>=0?hr:0)+'%</span></div>'
    +'<div class="mini" style="display:flex;align-items:center;gap:4px"><span style="width:36px;color:var(--mut)">week</span><span class="gb" style="flex:1"><i style="width:'+(wk>=0?Math.min(100,wk):0)+'%;background:'+colw+'"></i></span><span style="width:28px;text-align:right">'+(wk>=0?wk:0)+'%</span></div>'):'';
  const lid=a.label.replace(/'/g,'');const nm=a.email||a.label;const run=a.running||0;
  const pstate=a.paused?(run>0?' <span style="color:var(--pause)">pausing ('+run+' finishing)</span>':' <span style="color:var(--pause)">paused</span>'):(run>0?' <span class="free">'+run+' working</span>':'');
  return '<div style="margin:8px 0;'+(a.paused?'opacity:.55':'')+'"><div class="meta" style="justify-content:space-between"><span>'+esc(nm)+' <span class="tagk">'+esc(a.engine)+'</span>'+pstate+'</span><span class="mini">'+det+'</span></div>'+bars+'<div class="acts">'+(a.paused?'<button class="btn" onclick="api(\'/api/acctpause\',{label:\''+lid+'\',on:\'false\'})">▶ resume</button>':'<button class="btn p" onclick="api(\'/api/acctpause\',{label:\''+lid+'\',on:\'true\'})">⏸ pause</button>')+'</div></div>';}).join(''):'<div class="empty">no accounts</div>');}
function renderAside(){
  const d=S,tk=d.tickets||{},sv=d.servers||[],dv=d.devices||[],se=d.sentry||[];
  const up=sv.filter(s=>s.up).length,conn=dv.filter(x=>x.connected!==false).length;
  const sU=se.reduce((a,p)=>a+(p.unresolved||0),0),sR=se.reduce((a,p)=>a+(p.resolved||0),0);
  const go=t=>' style="cursor:pointer" onclick="goTab(\''+t+'\')"';
  const apprCnt=(tk.approval||[]).filter(i=>!approvedKeys.has(i.key)).length;
  const orq=(d.ownerRequests||[]).length;
  $('#aside').innerHTML='<div class="panel" style="cursor:pointer'+(orq?';border:1px solid var(--warn)':'')+'" onclick="openV(\'__needs__\')"><h2>🙋 Needs you ›</h2><div class="mini">'+(orq?'<span style="color:var(--warn)">🔑 <b>'+orq+'</b> access</span> · ':'')+'✅ <b>'+apprCnt+'</b> approve · 🔌 <b>'+((tk.hwWait||[]).length)+'</b> hardware · 🧪 <b>'+((tk.humanTest||[]).length)+'</b> human-test</div></div>'
    +'<div class="panel" style="cursor:pointer" onclick="openV(\'__accounts__\')"><h2>🔑 Accounts (Claude + Codex) — settings ›</h2>'+accountsHtml(d.accounts)+'</div>'
    +'<div class="panel"'+go('tasks')+'><h2>🎫 Tickets ›</h2><div class="mini">▶ <b>'+(tk.workingCnt||0)+'</b> working · ☐ <b>'+(tk.queueCnt||0)+'</b> queue · ✓ <b>'+(tk.doneCnt||0)+'</b> done · <span class="off">🐞 '+(tk.bugsCnt||0)+'</span> bugs</div></div>'
    +'<div class="panel"'+go('servers')+'><h2>🪵 Sentry ›</h2>'+(se.length?se.map(p=>'<div class="rowi"><span>'+esc(p.name)+'</span><span><span class="off">'+p.unresolved+(p.capped?'+':'')+'</span>/<span class="free">'+p.resolved+'</span></span></div>').join(''):'<div class="empty">—</div>')+'<div class="mini" style="margin-top:6px"><b>'+sU+'</b> to solve · <b>'+sR+'</b> solved</div></div>'
    +'<div class="panel"'+go('servers')+'><h2>🖥️ Servers ›</h2><div class="mini"><b>'+up+'</b> up · <b>'+(sv.length-up)+'</b> down</div></div>'
    +'<div class="panel"'+go('devices')+'><h2>🔌 Devices ›</h2><div class="mini"><b>'+conn+'</b> connected · '+(dv.length-conn)+' offline</div></div>'
    +'<div class="panel"><h2 style="cursor:pointer" onclick="openV(\'__chat__\')">💬 Chat with Tgo ›</h2>'
      +'<div class="mini" style="color:var(--mut);margin-bottom:6px">Ask the main agent anything (like Claude in VS Code) — it can do it.</div>'
      +'<div style="display:flex;gap:6px"><input id="sideChat" placeholder="ask Tgo to do anything…" style="flex:1;min-width:0" onkeydown="if(event.key===\'Enter\'){sendMain(this.value);this.value=\'\';}"/><button class="btn p" onclick="(function(){var e=document.getElementById(\'sideChat\');sendMain(e.value);e.value=\'\';})()">Send</button></div>'
      +'<div id="sideChatReply" class="mini" style="margin-top:6px;color:var(--mut)"></div></div>';
}
function renderSettings(){
  $('#main').innerHTML='<span class="back" onclick="goTab(tab)">← back</span>'
    +'<div class="panel" id="voicePanel"><h2>🎙️ Tgo voice assistant</h2><div class="empty">loading…</div></div>'
    +'<div class="panel"><h2>Change password</h2><input class="fin" id="cu" placeholder="username"/><input class="fin" id="co" type="password" placeholder="current password"/><input class="fin" id="cnw" type="password" placeholder="new password"/><button class="btn p" onclick="chPass()">change password</button></div>'
    +'<div class="panel"><h2>Add / set user</h2><input class="fin" id="au" placeholder="username"/><input class="fin" id="ap" type="password" placeholder="password"/><button class="btn p" onclick="addU()">add user</button><div id="ul" class="empty" style="margin-top:8px"></div></div>';
  fetch('/api/users/list',{credentials:'include'}).then(r=>r.json()).then(d=>{$('#ul').textContent='users: '+((d.users||[]).join(', ')||'—');}).catch(()=>{});
  loadVoice();
}
function loadVoice(){fetch('/api/voicecfg',{credentials:'include'}).then(r=>r.json()).then(renderVoice).catch(()=>{});}
function renderVoice(v){
  const p=$('#voicePanel');if(!p)return;
  const sel=(id,opts,cur)=>'<select id="'+id+'">'+opts.map(o=>'<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>';
  p.innerHTML='<h2>🎙️ Tgo voice assistant '+(v.enabled?'<span class="free">● ON'+(v.running?' · listening':''):'<span class="off">● OFF')+'</span></h2>'
    +'<div class="empty">Say your wake word ("Hey Tgo") and talk to Tgo — your local assistant that knows the whole dashboard. 100% local + your Azure keys; nobody sharing your Claude account can hear it. Off most of the time.</div>'
    +(v.azureReady?'':'<div class="mini" style="color:var(--pause)">⚠ Azure Speech key missing — STT/TTS will not work.</div>')
    +'<div class="acts" style="margin-top:8px"><button class="btn'+(v.enabled?' p':'')+'" onclick="api(\'/api/voicecfg\',{enabled:\''+(v.enabled?'false':'true')+'\'}).then(()=>setTimeout(loadVoice,500))">'+(v.enabled?'⏹ turn OFF':'▶ turn ON')+'</button></div>'
    +'<div class="sch" style="margin-top:12px;flex-wrap:wrap"><span class="mini">language</span>'+sel('v-lang',[['both','English + فارسی'],['en','English'],['fa','فارسی']],v.language)
    +'<span class="mini">voice</span>'+sel('v-gender',[['female','woman'],['male','man']],v.voiceGender)
    +'<span class="mini">STT</span>'+sel('v-stt',[['azure','Azure'],['google','Google'],['local','Local']],v.sttEngine)
    +'<span class="mini">TTS</span>'+sel('v-tts',[['azure','Azure'],['google','Google'],['local','Local']],v.ttsEngine)+'</div>'
    +'<div style="margin-top:10px"><div class="mini">local assistant active hours (e.g. 17:30-01:00 — comma for several; default 5:30pm→1am)</div><input id="v-win" class="fin" value="'+esc((v.activeWindows||[{from:"17:30",to:"01:00"}]).map(function(w){return w.from+"-"+w.to}).join(", "))+'"/></div>'
    +'<div style="margin-top:6px"><div class="mini">wake words (one per line — several allowed; "Hey Tgo" default)</div><textarea id="v-wake" class="fin" style="height:54px">'+esc((v.wakeWords||[]).join('\n'))+'</textarea></div>'
    +'<div><div class="mini">assistant names (one per line — "Tgo Agent" / "Tgo Main Agent")</div><textarea id="v-names" class="fin" style="height:48px">'+esc((v.agentNames||[]).join('\n'))+'</textarea></div>'
    +'<button class="btn p" onclick="saveVoice()">save voice settings</button>';
}
function saveVoice(){api('/api/voicecfg',{language:$('#v-lang').value,voiceGender:$('#v-gender').value,sttEngine:$('#v-stt').value,ttsEngine:$('#v-tts').value,activeWindows:$('#v-win').value,wakeWords:$('#v-wake').value,agentNames:$('#v-names').value}).then(()=>setTimeout(loadVoice,400));}
function chPass(){api('/api/users/changepass',{user:$('#cu').value,old:$('#co').value,new:$('#cnw').value}).then(r=>r.json()).then(d=>alert(d.ok?'Password changed ✓':'Wrong username or current password'));}
function addU(){if(!$('#au').value||!$('#ap').value)return;api('/api/users/add',{user:$('#au').value,pass:$('#ap').value}).then(()=>{renderSettings();});}
function renderHistory(){
  $('#main').innerHTML='<span class="back" onclick="goTab(tab)">← back</span><h2 class="sec" style="font-size:16px;color:var(--tx);text-transform:none">Last 24h — agents &amp; tasks</h2><div id="hist" class="empty">loading…</div>';
  fetch('/api/history',{credentials:'include'}).then(r=>r.json()).then(d=>{const h=d.history||[];
    $('#hist').innerHTML=h.length?'<div class="panel">'+h.map(x=>'<div class="rowi"><span>'+(x.time||'').slice(11,16)+' · <b style="color:var(--tx)">'+esc(x.name)+'</b> <span class="tagk">'+esc(x.runner||'')+'</span></span><span class="'+(x.ok?'free':'off')+'">'+(x.ok?'done':'retry')+(x.cost?' · $'+x.cost.toFixed(3):'')+'</span></div>').join('')+'</div>':'<div class="empty">no runs in the last 24h yet</div>';}).catch(()=>{$('#hist').textContent='—';});
}

/* ---------- chat + voice ---------- */
function addMsg(cls,who,body){const e=document.createElement('div');e.className='m '+cls;e.innerHTML='<span class="who">'+esc(who)+'</span><span class="body">'+esc(body)+'</span>';$('#clog').appendChild(e);$('#clog').scrollTop=1e9;}
async function sendChat(){const a=$('#cAgent').value,m=($('#cMsg').value||'').trim();if(!m)return;addMsg('me','you → '+a,m);$('#cMsg').value='';addMsg('ag',a,'…thinking');
  const r=await api('/api/chat',{agent:a,message:m}).then(r=>r.json()).catch(()=>({reply:'(failed)'}));$('#clog').lastChild.querySelector('.body').textContent=r.reply||'(no reply)';}
let rec=null;
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice needs Safari/Chrome.');return;}
  if(rec){rec.stop();rec=null;$('#mic').classList.remove('rec');return;}
  rec=new SR();rec.interimResults=false;$('#mic').classList.add('rec');
  rec.onresult=e=>{$('#cMsg').value=e.results[0][0].transcript;rec=null;$('#mic').classList.remove('rec');sendChat();};
  rec.onerror=()=>{rec=null;$('#mic').classList.remove('rec');};rec.onend=()=>{$('#mic').classList.remove('rec');};
  rec.start();
}
boot();
</script>
